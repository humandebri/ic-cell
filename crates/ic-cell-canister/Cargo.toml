[package]
name = "ic-cell-canister"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candid.workspace = true
ic-cdk.workspace = true
serde.workspace = true
thiserror.workspace = true
crc = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
ic-sqlite-vfs = { git = "https://github.com/humandebri/ic-sqlite-vfs.git", rev = "acdc6b0", default-features = false, features = ["sqlite-precompiled"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ic-sqlite-vfs = { git = "https://github.com/humandebri/ic-sqlite-vfs.git", rev = "acdc6b0", default-features = false, features = ["sqlite-bundled"] }

[dev-dependencies]
serial_test = "3"
candid_parser = "0.2"
