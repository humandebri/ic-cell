name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Run Rust workspace tests
        run: cargo test --workspace -- --test-threads=1
      - name: Check wasm32 canister build
        run: cargo check -p ic-cell-canister --target wasm32-unknown-unknown
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  e2e:
    runs-on: ubuntu-latest
    env:
      POCKET_IC_VERSION: "11.0.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - name: Install TypeScript SDK dev dependencies (for the live TS E2E)
        working-directory: packages/typescript-sdk
        run: bun install --frozen-lockfile
      - name: Build canister wasm
        run: cargo build -p ic-cell-canister --target wasm32-unknown-unknown --release
      - name: Install PocketIC server
        run: |
          curl -sSfL "https://github.com/dfinity/pocketic/releases/download/${POCKET_IC_VERSION}/pocket-ic-x86_64-linux.gz" -o pocket-ic.gz
          gunzip pocket-ic.gz
          chmod +x pocket-ic
          echo "POCKET_IC_BIN=$PWD/pocket-ic" >> "$GITHUB_ENV"
      - name: PocketIC end-to-end tests
        env:
          IC_CELL_E2E_REQUIRED: "1"
        run: cargo test -p ic-cell-e2e -- --test-threads=1

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/typescript-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - name: Install dev dependencies
        run: bun install --frozen-lockfile
      - name: Type-check SDK, tests and examples
        run: bun x tsc -p .
      - name: Run TypeScript SDK tests
        run: node --experimental-strip-types --test test/*.test.ts
      - name: Run examples
        working-directory: .
        run: |
          node --experimental-strip-types examples/durable-counter/index.ts
          node --experimental-strip-types examples/immortal-agent/index.ts
