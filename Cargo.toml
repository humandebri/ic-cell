[workspace]
resolver = "2"
members = [
    "crates/ic-cell-canister",
    "crates/ic-cell-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
candid = "0.10"
ic-cdk = "0.20.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
